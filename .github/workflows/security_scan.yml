name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Bandit and Safety
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit (Static Analysis)
      run: |
        bandit -r backend/ -ll -i

    - name: Run Safety (Dependency Audit)
      run: |
        safety check -r backend/requirements.txt
